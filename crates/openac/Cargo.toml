[package]
name = "openac"
description = "The openAC client: runs game sessions headless or with a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
ac-net.workspace = true
ac-runtime.workspace = true
ctrlc.workspace = true
ac-render.workspace = true
ac-host.workspace = true
ac-core.workspace = true
ac-dat.workspace = true
ac-proto.workspace = true
ac-ui.workspace = true
ac-plugin.workspace = true
# The software-rendered terminal front end (`--ui terminal`) projects the
# world with the same glam math the renderer uses.
glam.workspace = true
# Terminal rendering modes (`--ui ratatui`, `--ui terminal`).
ratatui.workspace = true
crossterm.workspace = true

[dev-dependencies]
# The launcher end-to-end test drives this binary through the launcher core.
ac-launcher-core.workspace = true
# The console-stop test speaks the wire to its loopback stand-in servers.
ac-bits.workspace = true
# The animation regression test drives a motion state through the presenter.
ac-motion.workspace = true
ac-physics.workspace = true
# The terminal front end diverts standard error off the rendered frame on Unix
# (the alt screen and stderr share the terminal); `nix::unistd::dup2` does it.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["fs"] }

# The console-stop test sends SIGTERM and SIGHUP to the client on Unix.
[target.'cfg(unix)'.dev-dependencies]
nix.workspace = true

[lints]
workspace = true
